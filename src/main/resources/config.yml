  "O=[Al]O[Al]=O": "Aluminium Oxide"
  "[Be]=O": "Beryllium Oxide"
  "P": "Phosphorus"
  "C.[U]": "Radioactive Redstone Essence"
  "S1SSSSSSS1": "Cyclooctasulfur"
